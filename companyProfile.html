<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/companyProfile.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/companyProfile.js"></script>
</head>
<body>
    <!-- ヘッダー -->
    <header id="header"></header>
    <div>会社概要</div>
    <!-- フッター -->
     <main>
      <div class="index-1">
      <div class="company-profile" role="region" aria-labelledby="company-profile-title">
    <h2 id="company-profile-title" class="visually-hidden">会社概要</h2>

    <!-- 行のテンプレート -->
    <div class="company-row">
      <div class="company-key">社名</div>
      <div class="company-value">株式会社 イーアンドティー（略称 E&T）</div>
    </div>

     <div class="company-row">
      <div class="company-key">所在地</div>
      <div class="company-value">〒550-0013 大阪市西区新町1丁目8番1号 行成ビル8F（旧 諏訪ビル）</div>
    </div>

    <div class="company-row">
      <div class="company-key">設立</div>
      <div class="company-value">1984年6月</div>
    </div>

    <div class="company-row">
      <div class="company-key">資本金</div>
      <div class="company-value">1,000万円</div>
    </div>
    
    <div class="company-row">
      <div class="company-key">売上高</div>
      <div class="company-value">15.9億円（2021年度実績）</div>
    </div>

    <div class="company-row">
      <div class="company-key">従業員数</div>
      <div class="company-value">103名（2019月年4月現在）</div>
    </div>

    <div class="company-row">
      <div class="company-key">代表者</div>
      <div class="company-value">代表取締役社長  朝井  勉</div>
    </div>

    <div class="company-row">
      <div class="company-key">主要取引銀行</div>
      <div class="company-value">三菱東京UFJ銀行、みずほ銀行、三井住友銀行、りそな銀行</div>
    </div>

  </div>
</div>
     </main>
    <footer id="footer">
    </footer>
</body>
</html>
